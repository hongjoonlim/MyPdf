name: Native builds
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config qt6-base-dev libpoppler-qt6-dev qpdf qt6-translations-l10n zlib1g-dev
      - name: Build and test
        run: ./scripts/build.sh

      - name: Test Linux packaging logic
        run: python3 tests/package_linux_test.py
      - name: Build Release AppImage
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          ./scripts/package-linux.sh
      - name: Test AppImage without Qt or qpdf installed
        run: |
          docker run --rm -v "$PWD:/work:ro" ubuntu:24.04 bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends libegl1 libglx0 libopengl0 libx11-6 libx11-xcb1 libxcb1 libice6 libsm6 fonts-dejavu-core
            cd /tmp
            /work/dist/MyPdf-*-x86_64.AppImage --appimage-extract
            export LD_LIBRARY_PATH=/tmp/squashfs-root/usr/lib
            export QT_PLUGIN_PATH=/tmp/squashfs-root/usr/plugins
            export QT_QPA_PLATFORM=offscreen
            export MYPDF_QPDF=/tmp/squashfs-root/usr/bin/qpdf
            export MYPDF_SMOKE_TEST=1
            "$MYPDF_QPDF" --version
            /tmp/squashfs-root/AppRun
            /work/build/pdfcore_test
          '
      - uses: actions/upload-artifact@v4
        with:
          name: MyPdf-linux-x86_64
          path: dist/*.AppImage*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-poppler-qt6
            mingw-w64-ucrt-x86_64-qpdf
            mingw-w64-ucrt-x86_64-zlib
      - name: Build and test
        shell: msys2 {0}
        run: ./scripts/build.sh

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake ninja pkgconf qtbase qttranslations poppler-qt6 qpdf zlib vulkan-headers
      - name: Build and test
        run: ./scripts/build.sh
      - name: Launch macOS app
        run: MYPDF_SMOKE_TEST=1 ./scripts/run.sh
      - name: Check app bundle installation
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/MyPdf-install"
          test -f "$RUNNER_TEMP/MyPdf-install/MyPdf.app/Contents/MacOS/MyPdf"
          test -f "$RUNNER_TEMP/MyPdf-install/MyPdf.app/Contents/Resources/MyPdf.icns"
          test -f "$RUNNER_TEMP/MyPdf-install/MyPdf.app/Contents/Resources/qt.conf"
      - name: Test dependency relocation
        run: python3 tests/package_macos_test.py
      - name: Package standalone macOS app
        run: |
          ./scripts/package-macos.sh
          ditto -c -k --sequesterRsrc --keepParent dist/MyPdf.app dist/MyPdf-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MyPdf-macos
          path: dist/MyPdf-macos.zip
